<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maus Visual Mask Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
    }

    /* Outer Frame Container */
    .app-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fixed Center Target (Where the mask aligns with human face) */
    .center-frame {
      position: absolute;
      width: 260px;
      height: 260px;
      border: 4px solid #ffffff;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
    }

    /* Fixed Human Face Silhouette */
    .human-face {
      font-size: 8rem;
      user-select: none;
      z-index: 2;
    }

    /* Horizontal Scroll Ribbon for Animal Masks */
    .mask-scroll-ribbon {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      overflow-x: scroll;
      scroll-snap-type: x mandatory;
      z-index: 10;
      /* Padding lets the first and last mask snap dead-center */
      padding-left: calc(50vw - 130px);
      padding-right: calc(50vw - 130px);
    }

    /* Hide scrollbar for clean visual presentation */
