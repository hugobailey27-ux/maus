<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masks — a response to Maus</title>
<meta name="description" content="An interactive scroll piece responding to Art Spiegelman's Maus: a single face, and the masks it receives.">
<style>
  :root{
    --paper:#E7E1D2;
    --ink:#211E1A;
    --red:#9C2B22;
    --grey:#6f6a5e;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--ink);
    overscroll-behavior:none;
  }

  body{ overflow:hidden; }

  /* ---------- scroller ---------- */
  .scroller{
    height:100%;
    width:100%;
    display:flex;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }
  .scroller::-webkit-scrollbar{ display:none; }
  .scroller{ scrollbar-width:none; }

  .panel{
    flex:0 0 100vw;
    height:100%;
    scroll-snap-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .frame{
    width:min(64vh, 78vw);
    height:min(64vh, 78vw);
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    border:5px solid var(--ink);
    opacity:0;
    transform:scale(0.96);
    transition:opacity .6s ease, transform .6s ease;
  }
  .panel.active .frame{
    opacity:1;
    transform:scale(1);
  }

  .frame svg{
    width:78%;
    height:78%;
  }

  .mask-layer{
    opacity:0;
    transform:scale(0.8) translateY(-18px);
    transform-origin:150px 60px;
    transition:opacity .5s ease .15s, transform .55s cubic-bezier(.2,.8,.2,1) .15s;
  }
  .panel.active .mask-layer{
    opacity:1;
    transform:scale(1) translateY(0);
  }
  @media (prefers-reduced-motion: reduce){
    .mask-layer, .frame{ transition:none; }
  }

  /* ---------- bottom controls ---------- */
  .bottombar{
    position:fixed;
    bottom:0; left:0; right:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:24px;
    pointer-events:none;
  }
  .navbtn{
    pointer-events:all;
    background:transparent;
    border:1.5px solid var(--grey);
    color:var(--paper);
    width:34px; height:34px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    line-height:1;
    transition:background .2s ease, border-color .2s ease;
  }
  .navbtn:hover{ background:rgba(231,225,210,0.12); border-color:var(--paper); }
  .navbtn:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }

  .dots{
    display:flex;
    gap:8px;
    pointer-events:all;
  }
  .dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--grey);
    cursor:pointer;
    border:none;
    padding:0;
    transition:background .2s ease, transform .2s ease;
  }
  .dot:focus-visible{ outline:2px solid var(--red);
