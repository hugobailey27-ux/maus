<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maus: The Mask & Identity Interface</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Courier New', Courier, monospace;
      line-height: 1.6;
      padding: 2rem;
    }

    /* Header Controls */
    .header-container {
      max-width: 900px;
      margin: 0 auto 2rem auto;
      text-align: center;
      border-bottom: 2px solid #444;
      padding-bottom: 1.5rem;
    }

    .header-container h1 {
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    /* Global UI Toggle Bar */
    .toggle-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #1a1a1a;
      border: 2px solid #fff;
      padding: 0.75rem 1.5rem;
      width: fit-content;
      margin: 0 auto;
    }

    .toggle-label {
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    /* Switch Styling */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333;
      transition: .4s;
      border: 1px solid #fff;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      transition: .4s;
    }

    input:checked + .slider {
      background-color: #fff;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
      background-color: #000;
    }

    /* Grid layout for Character Cards */
    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: #000;
      border: 3px solid #fff;
      padding: 1.5rem;
      text-align: center;
      position: relative;
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 0.2rem;
    }

    .role {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1rem;
    }

    /* Visual Mask Display Container */
    .mask-display {
      height: 160px;
      border: 2px dashed #444;
      margin: 1rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      padding: 1rem;
      transition: all 0.3s ease;
    }

    .mask-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .mask-title {
      font-weight: bold;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .mask-desc {
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 0.25rem;
    }

    .quote-box {
      font-size: 0.8rem;
      font-style: italic;
      color: #ddd;
      border-top: 1px solid #333;
      padding-top: 0.75rem;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>

    <h1>MAUS: THE MASK OF IDENTITY</h1>
    <p class="subtitle">An Interactive Exploration of Spiegelman's Animal Metaphor</p>

      <span class="toggle-label" id="labelLeft">ANIMAL METAPHOR</span>
      <label class="switch">
        <input type="checkbox" id="identityToggle">
        <span class="slider"></span>
      </label>
      <span class="toggle-label" id="labelRight" style="color:#666;">HUMAN IDENTITY</span>
    </div>
  </div>

  <main class="character-grid">
